<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Staff login | G1 Gazette</title>
	<style>
		:root { color-scheme: light; --ink: #171717; --muted: #5c5547; --paper: #fff8dc; --white: #fffdf2; --line: #e4c84a; --red: #b3131b; }
		* { box-sizing: border-box; }
		body { display: grid; min-height: 100vh; margin: 0; padding: 24px; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; place-items: center; }
		main { width: min(440px, 100%); padding: 32px; background: var(--white); border: 1px solid var(--line); box-shadow: 6px 6px 0 rgba(179, 19, 27, 0.14); }
		.brand { display: inline-block; margin-bottom: 20px; color: var(--ink); font-size: 1.2rem; font-weight: 800; text-decoration: none; }
		.brand span, h1 { color: var(--red); }
		h1 { margin: 0; font-size: 2rem; }
		p { color: var(--muted); }
		form { display: grid; gap: 14px; margin-top: 24px; }
		label { display: grid; gap: 6px; font-size: 0.88rem; font-weight: 700; }
		input { width: 100%; padding: 12px; color: var(--ink); background: var(--white); border: 1px solid var(--line); font: inherit; }
		input:focus { border-color: var(--red); outline: 2px solid rgba(179, 19, 27, 0.16); }
		button { padding: 12px 16px; color: var(--white); background: var(--red); border: 0; font: inherit; font-weight: 800; cursor: pointer; }
		button:hover { background: #8f0c13; }
		.status { min-height: 24px; margin: 0; color: var(--red); font-size: 0.88rem; font-weight: 700; }
		.back-link { color: var(--red); font-weight: 700; }
	</style>
</head>
<body>
	<main>
		<a class="brand" href="index.html"><span>G1</span> Gazette</a>
		<h1>Staff login</h1>
		<p>Sign in with your newsroom account to continue to the dashboard.</p>
		<form id="login-form">
			<label>Username <input id="username" type="text" autocomplete="username" required /></label>
			<label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
			<button type="submit">Continue to dashboard</button>
			<p class="status" id="login-status" role="status" aria-live="polite"></p>
		</form>
		<a class="back-link" href="index.html">← Back to latest stories</a>
	</main>
	<script>
		const defaultAccounts = {
			administrator: { username: 'administrator', password: 'godmode123', role: 'administrator' },
			'chief-director': { username: 'director', password: 'director123', role: 'chief-director' },
			editor: { username: 'editor', password: 'editor123', role: 'editor' },
		};
		document.getElementById('login-form').addEventListener('submit', (event) => {
			event.preventDefault();
			const accounts = { ...defaultAccounts, ...JSON.parse(localStorage.getItem('staffAccounts') || '{}') };
			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;
			const account = Object.values(accounts).find((item) => item.username === username && item.password === password);
			if (account) {
				window.location.href = `dashboard.html?role=${encodeURIComponent(account.role)}`;
				return;
			}
			document.getElementById('login-status').textContent = 'Username or password is incorrect.';
		});
	</script>
</body>
</html>
